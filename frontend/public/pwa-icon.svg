<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14183e"/>
      <stop offset="50%" stop-color="#0c0e22"/>
      <stop offset="100%" stop-color="#060710"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Background with Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.8" />

  <!-- Background Shield Glow -->
  <path d="M256 70 L390 125 C390 280 256 405 256 405 C256 405 122 280 122 125 Z" fill="url(#shieldGrad)" opacity="0.75" filter="url(#glow)"/>
  <path d="M256 86 L374 135 C374 270 256 380 256 380 C256 380 138 270 138 135 Z" fill="#0f1128" stroke="#a78bfa" stroke-width="4"/>

  <!-- Glowing Lightning Bolt / Sword Symbol -->
  <path d="M280 130 L180 260 L245 260 L220 375 L335 235 L270 235 Z" fill="url(#lightningGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Decorative Game Stars & Circles -->
  <circle cx="256" cy="435" r="8" fill="#f59e0b"/>
  <circle cx="210" cy="435" r="5" fill="#a78bfa"/>
  <circle cx="302" cy="435" r="5" fill="#a78bfa"/>
</svg>
